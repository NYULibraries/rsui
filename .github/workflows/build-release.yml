name: Build and Release Laravel App
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create (for example, v1.0.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup PHP 8.3 and Install Dependencies
      # Pinned to 8.3.36+ to include the fix for CVE-2026-109618 / CVE-2026-109619
      # ("PHP2Shell", https://www.wiz.io/blog/php2shell-php-rce)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring, dom, curl, libxml, zip, bcmath, gd, pdo_sqlite, xsl
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # AppServiceProvider::boot() validates required env vars (e.g. RS_V1_ENDPOINT) on
      # every framework bootstrap, including the `artisan package:discover` call that
      # Composer's post-autoload-dump script triggers. Seed a disposable .env from the
      # example file so that bootstrap succeeds in CI; it's git-ignored and excluded
      # from the release archive by the git-archive-based packaging step below.
      - name: Seed build-time .env
        run: cp .env.example .env

      - name: Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 2. Setup Node 22 & Build Assets
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Build Assets
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 3. Verify build outputs
      - name: Verify Build Assets
        run: |
          if [ -d "public/build" ]; then
            echo "Assets found in public/build"
            ls -la public/build
          else
            echo "ERROR: public/build not found. Assets failed to compile."
            exit 1
          fi

      # 4. Determine if this is a prerelease
      - name: Check if prerelease
        id: check_prerelease
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          TAG="${TAG_NAME:-${GITHUB_REF#refs/tags/}}"
          if [[ "$TAG" =~ (alpha|beta|rc|dev|preview) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a PRERELEASE: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a STABLE RELEASE: $TAG"
          fi

      # 5. Packaging
      # Source-controlled dev/CI-only files (tests, docker, tooling configs, etc.)
      # are excluded via `export-ignore` entries in .gitattributes, so `git archive`
      # keeps this step free of a hand-maintained exclude list. We then layer in the
      # build artifacts that are never committed (vendor/, public/build) plus the
      # writable runtime directories Laravel expects to exist.
      - name: Prepare Archive
        run: |
          set -euo pipefail

          STAGE_DIR="$(mktemp -d)"
          git archive HEAD --format=tar | tar -x -C "$STAGE_DIR"

          cp -r vendor "$STAGE_DIR/vendor"
          cp -r public/build "$STAGE_DIR/public/build"

          mkdir -p "$STAGE_DIR"/storage/framework/{cache,sessions,views}
          mkdir -p "$STAGE_DIR"/storage/logs
          mkdir -p "$STAGE_DIR"/bootstrap/cache
          chmod -R 755 "$STAGE_DIR"/storage "$STAGE_DIR"/bootstrap/cache

          tar -czf release.tar.gz -C "$STAGE_DIR" .
          rm -rf "$STAGE_DIR"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.tar.gz
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployment is handled out-of-band by the Ansible playbook, which pulls the
  # published GitHub Release. If/when this workflow should trigger that Ansible
  # run directly (e.g. via an AWX/Tower webhook or `ansible-pull`), add a real
  # job here — placeholder "echo" jobs were removed since they did nothing but
  # spin up extra runners.
